<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pynotas">
<title>Pynotas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<link rel="icon" href="assets/icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<div id="app">
  <header>
    <div class="pr"><span class="p">~/pynotas</span><span class="d">$</span><span class="cmd">python main.py</span><span class="cur"></span></div>
    <div class="bs"><button class="bt" id="cl">clear</button><button class="bt run" id="rn">run<kbd>⌘↵</kbd></button></div>
  </header>
  <main>
    <section class="pn">
      <div class="lb">input</div>
      <div class="ed"><pre id="g" aria-hidden="true">1</pre><div class="cd"><pre id="hl" aria-hidden="true"></pre><textarea id="ta" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off" aria-label="Código Python"></textarea></div></div>
      <div class="si"><div class="lb">stdin (uma linha para cada input)</div><textarea id="in" spellcheck="false" autocapitalize="off" autocorrect="off" placeholder="opcional"></textarea></div>
    </section>
    <section class="pn">
      <div class="lb">output</div>
      <pre id="out" aria-live="polite"></pre>
      <div id="st"></div>
    </section>
  </main>
</div>
<script src="assets/js/app.js"></script>
</body>
</html>
